  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <circle cx="32" cy="32" r="16.5" fill="none" stroke="#fff" stroke-width="4.5"/>
  <circle cx="32" cy="32" r="6.5" fill="#fff"/>
